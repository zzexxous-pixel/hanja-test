<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>한자 마스터 - 획순 & 쓰기 테스트</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .badge-group {
      display: flex;
      gap: 6px;
    }

    .badge {
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge.accent {
      background: #fee2e2;
      color: #b91c1c;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* 캔버스 컨테이너 (田자형 320x320) */
    .canvas-container {
      position: relative;
      width: 320px;
      height: 320px;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
    }

    #writingCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* 섹션 공통 스타일 */
    .section-title {
      width: 100%;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 4px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    /* 컨트롤 그리드 */
    .controls-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="text"], select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      background: #fff;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
    }

    /* 획순 조작 버튼 그룹 */
    .stroke-order-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f1f5f9;
      padding: 10px;
      border-radius: 8px;
    }

    .btn-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }

    .checkbox-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    button {
      padding: 9px 8px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    button:hover:not(:disabled) {
      background: #e2e8f0;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--primary);
      color: white;
      border: none;
    }

    button.primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    button.accent {
      background: var(--accent);
      color: white;
      border: none;
    }

    button.accent:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .brush-options {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      flex: 1;
    }

    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }

    .info-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>한자 획순 & 쓰기 테스트</h1>
      <div class="badge-group">
        <span class="badge accent" id="orderBadge">획순: 0 / 5</span>
        <span class="badge" id="strokeBadge">필기: 0 획</span>
      </div>
    </div>

    <div class="card">
      <!-- 田자형 캔버스 -->
      <div class="canvas-container">
        <canvas id="writingCanvas"></canvas>
      </div>

      <!-- 1. 한자 선택 및 田자 격자 옵션 -->
      <div class="controls-grid">
        <div class="control-group">
          <label for="hanjaPreset">프리셋 한자</label>
          <select id="hanjaPreset"></select>
        </div>
        <div class="control-group">
          <label for="animSpeedSelect">애니메이션 속도</label>
          <select id="animSpeedSelect">
            <option value="0.6">0.6x (천천히)</option>
            <option value="1.0" selected>1.0x (보통)</option>
            <option value="1.5">1.5x (빠르게)</option>
            <option value="2.0">2.0x (2배속)</option>
          </select>
        </div>
      </div>

      <!-- 2. 획순 가이드 컨트롤 패널 -->
      <div class="stroke-order-panel">
        <div class="checkbox-row">
          <label class="checkbox-label">
            <input type="checkbox" id="chkStrokeNumbers" checked>
            <span>획순 번호(①,②..) 표시</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chkWatermark" checked>
            <span>연한 글자 보기</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chkGrid" checked>
            <span>田 격자</span>
          </label>
        </div>

        <div class="btn-row">
          <button id="btnPlay" class="accent">▶ 재생</button>
          <button id="btnPause">⏸ 정지</button>
          <button id="btnPrev">◀ 이전획</button>
          <button id="btnNext">다음획 ▶</button>
        </div>
      </div>

      <!-- 3. 사용자 필기 도구 -->
      <div class="section-title">직접 쓰기 도구</div>
      <div class="controls-grid">
        <div class="control-group">
          <label for="lineWidth">붓 굵기 (<span id="widthValue">9</span>px)</label>
          <div class="brush-options">
            <input type="range" id="lineWidth" min="3" max="25" value="9">
          </div>
        </div>
        <div class="control-group">
          <label for="lineColor">붓 색상</label>
          <div class="brush-options">
            <input type="color" id="lineColor" value="#1e293b">
          </div>
        </div>
      </div>

      <div class="btn-row">
        <button id="btnUndo" disabled>되돌리기</button>
        <button id="btnRedo" disabled>다시실행</button>
        <button id="btnClear">지우기</button>
        <button id="btnSave" class="primary">저장</button>
      </div>

      <div class="info-bar">
        <span>상태: <strong id="statusText">준비 완료</strong></span>
        <span id="canvasDim">320 x 320 (田자형)</span>
      </div>
    </div>
  </div>

  <script src="../writingEngine.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('writingCanvas');
      const hanjaPreset = document.getElementById('hanjaPreset');
      const animSpeedSelect = document.getElementById('animSpeedSelect');
      
      const chkStrokeNumbers = document.getElementById('chkStrokeNumbers');
      const chkWatermark = document.getElementById('chkWatermark');
      const chkGrid = document.getElementById('chkGrid');

      const btnPlay = document.getElementById('btnPlay');
      const btnPause = document.getElementById('btnPause');
      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');

      const lineWidth = document.getElementById('lineWidth');
      const widthValue = document.getElementById('widthValue');
      const lineColor = document.getElementById('lineColor');

      const btnUndo = document.getElementById('btnUndo');
      const btnRedo = document.getElementById('btnRedo');
      const btnClear = document.getElementById('btnClear');
      const btnSave = document.getElementById('btnSave');

      const orderBadge = document.getElementById('orderBadge');
      const strokeBadge = document.getElementById('strokeBadge');
      const statusText = document.getElementById('statusText');

      // WritingEngine 인스턴스 초기화
      const writer = new WritingEngine({
        canvas: canvas,
        guideChar: '永',
        showGrid: true,
        showGuideChar: true,
        showStrokeNumbers: true,
        strokeWidth: lineWidth.value,
        strokeColor: lineColor.value,
        onStrokeChange: (current, total) => {
          orderBadge.textContent = `획순: ${current} / ${total}`;
        },
        onAnimComplete: () => {
          statusText.textContent = '획순 시연 완료';
        },
        onChange: (state) => {
          strokeBadge.textContent = `필기: ${state.strokeCount} 획`;
          btnUndo.disabled = !state.canUndo;
          btnRedo.disabled = !state.canRedo;
        }
      });

      // 프리셋 셀렉트 박스 바인딩
      const presets = writer.getAvailablePresets();
      presets.forEach(char => {
        const opt = document.createElement('option');
        opt.value = char;
        opt.textContent = `${char} (${writer.strokeOrderData ? '획순 지원' : ''})`;
        hanjaPreset.appendChild(opt);
      });
      hanjaPreset.value = '永';

      // 1. 한자 변경 이벤트
      hanjaPreset.addEventListener('change', (e) => {
        writer.setCharacter(e.target.value);
        statusText.textContent = `'${e.target.value}' 획순 로드됨`;
      });

      animSpeedSelect.addEventListener('change', (e) => {
        writer.setAnimSpeed(Number(e.target.value));
      });

      // 2. 획순 가이드 조작 이벤트
      chkStrokeNumbers.addEventListener('change', (e) => {
        writer.toggleStrokeNumbers(e.target.checked);
      });

      chkWatermark.addEventListener('change', (e) => {
        writer.setShowGuideChar(e.target.checked);
      });

      chkGrid.addEventListener('change', (e) => {
        writer.setShowGrid(e.target.checked);
      });

      btnPlay.addEventListener('click', () => {
        writer.playAnimation(true);
        statusText.textContent = '획순 애니메이션 재생 중...';
      });

      btnPause.addEventListener('click', () => {
        writer.pauseAnimation();
        statusText.textContent = '일시 정지됨';
      });

      btnPrev.addEventListener('click', () => {
        writer.stepPrevStroke();
        statusText.textContent = '이전 획 탐색';
      });

      btnNext.addEventListener('click', () => {
        writer.stepNextStroke();
        statusText.textContent = '다음 획 탐색';
      });

      // 3. 사용자 필기 도구 이벤트
      lineWidth.addEventListener('input', (e) => {
        widthValue.textContent = e.target.value;
        writer.setStrokeWidth(e.target.value);
      });

      lineColor.addEventListener('input', (e) => {
        writer.setStrokeColor(e.target.value);
      });

      btnUndo.addEventListener('click', () => writer.undo());
      btnRedo.addEventListener('click', () => writer.redo());
      btnClear.addEventListener('click', () => {
        writer.clear();
        statusText.textContent = '필기 지움';
      });

      btnSave.addEventListener('click', () => {
        const dataUrl = writer.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = `hanja_${hanjaPreset.value || 'write'}.png`;
        link.href = dataUrl;
        link.click();
        statusText.textContent = 'PNG 다운로드 완료';
      });
    });
  </script>
</body>
</html>
