<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>한자 마스터 - 쓰기 엔진 테스트</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
    }

    .header {
      width: 100%;
      max-width: 480px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .badge {
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* 캔버스 컨테이너 */
    .canvas-container {
      position: relative;
      width: 300px;
      height: 300px;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
    }

    #writingCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* 컨트롤 영역 */
    .controls-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="text"], select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
    }

    .brush-options {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      flex: 1;
    }

    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }

    /* 버튼 그룹 */
    .button-group {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f1f5f9;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) {
      background: #e2e8f0;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--primary);
      color: white;
      border: none;
    }

    button.primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .info-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>한자 쓰기 엔진 테스트</h1>
    <span class="badge" id="strokeBadge">0 획</span>
  </div>

  <div class="card">
    <div class="canvas-container">
      <canvas id="writingCanvas"></canvas>
    </div>

    <div class="controls-grid">
      <div class="control-group">
        <label for="hanjaInput">가이드 한자</label>
        <input type="text" id="hanjaInput" maxlength="1" value="永" placeholder="한자 입력">
      </div>

      <div class="control-group">
        <label for="gridSelect">격자 형태</label>
        <select id="gridSelect">
          <option value="mi" selected>米자형 (8격)</option>
          <option value="tian">田자형 (4격)</option>
          <option value="none">격자 없음</option>
        </select>
      </div>

      <div class="control-group">
        <label for="lineWidth">붓 굵기 (<span id="widthValue">10</span>px)</label>
        <div class="brush-options">
          <input type="range" id="lineWidth" min="3" max="25" value="10">
        </div>
      </div>

      <div class="control-group">
        <label for="lineColor">붓 색상</label>
        <div class="brush-options">
          <input type="color" id="lineColor" value="#1e293b">
        </div>
      </div>
    </div>

    <div class="button-group">
      <button id="btnUndo" disabled>되돌리기</button>
      <button id="btnRedo" disabled>다시실행</button>
      <button id="btnClear">지우기</button>
      <button id="btnSave" class="primary">저장</button>
    </div>

    <div class="info-bar">
      <span>상태: <strong id="statusText">준비 완료</strong></span>
      <span id="canvasDim">300 x 300</span>
    </div>
  </div>

  <!-- writingEngine 불러오기 (루트 경로 기준 또는 상대 경로) -->
  <script src="../writingEngine.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('writingCanvas');
      const hanjaInput = document.getElementById('hanjaInput');
      const gridSelect = document.getElementById('gridSelect');
      const lineWidth = document.getElementById('lineWidth');
      const widthValue = document.getElementById('widthValue');
      const lineColor = document.getElementById('lineColor');
      
      const btnUndo = document.getElementById('btnUndo');
      const btnRedo = document.getElementById('btnRedo');
      const btnClear = document.getElementById('btnClear');
      const btnSave = document.getElementById('btnSave');
      
      const strokeBadge = document.getElementById('strokeBadge');
      const statusText = document.getElementById('statusText');

      // WritingEngine 인스턴스 생성
      const writer = new WritingEngine({
        canvas: canvas,
        guideChar: hanjaInput.value,
        strokeWidth: lineWidth.value,
        strokeColor: lineColor.value,
        gridType: gridSelect.value,
        onStrokeStart: () => {
          statusText.textContent = '작성 중...';
        },
        onStrokeEnd: (count) => {
          statusText.textContent = '획 완료';
        },
        onChange: (state) => {
          strokeBadge.textContent = `${state.strokeCount} 획`;
          btnUndo.disabled = !state.canUndo;
          btnRedo.disabled = !state.canRedo;
        }
      });

      // UI 이벤트 바인딩
      hanjaInput.addEventListener('input', (e) => {
        writer.setGuideChar(e.target.value);
      });

      gridSelect.addEventListener('change', (e) => {
        writer.setGridType(e.target.value);
      });

      lineWidth.addEventListener('input', (e) => {
        widthValue.textContent = e.target.value;
        writer.setStrokeWidth(e.target.value);
      });

      lineColor.addEventListener('input', (e) => {
        writer.setStrokeColor(e.target.value);
      });

      btnUndo.addEventListener('click', () => writer.undo());
      btnRedo.addEventListener('click', () => writer.redo());
      btnClear.addEventListener('click', () => writer.clear());

      btnSave.addEventListener('click', () => {
        const dataUrl = writer.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = `hanja_${hanjaInput.value || 'write'}.png`;
        link.href = dataUrl;
        link.click();
        statusText.textContent = 'PNG 저장 완료';
      });
    });
  </script>
</body>
</html>
